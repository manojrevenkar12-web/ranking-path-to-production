apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: buyer-mlops
labels:
  - pairs: {app.kubernetes.io/part-of: ranking-path-to-production}
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - config.yaml
  - relay.yaml
  - console.yaml
  - triton.yaml
  - networkpolicy.yaml
# `image: ptp` is a placeholder: each overlay names the registry and tag for its environment
