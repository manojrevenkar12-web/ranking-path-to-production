# Workload Identity: each workload acts as its own Google service account, no key files.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay
  annotations:
    iam.gke.io/gcp-service-account: ml-relay@vinted-buyer-ml-dev.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console
  annotations:
    iam.gke.io/gcp-service-account: ml-console@vinted-buyer-ml-dev.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triton
  annotations:
    iam.gke.io/gcp-service-account: triton-reader@vinted-buyer-ml-dev.iam.gserviceaccount.com
