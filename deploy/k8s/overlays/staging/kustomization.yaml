apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: buyer-mlops-staging
images:
  - name: ptp
    newName: europe-docker.pkg.dev/vinted-buyer-ml-staging/ml/ranking-path-to-production
    newTag: latest   # the CD pipeline pins the image digest here
patches:
  - target: {kind: Namespace, name: buyer-mlops}
    patch: |-
      - op: replace
        path: /metadata/name
        value: buyer-mlops-staging
