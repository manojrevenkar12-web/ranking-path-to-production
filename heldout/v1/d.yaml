name: heldout-v1-d
description: >
  A short season with no homepage retrains. To fight overfitting on the noisy long tail, the team raises
  min_child_samples sharply, which is sensible for FR and DE but leaves the small LT market with almost no
  leaves of its own. A PL feature pipeline drops price_fit for a day (not noticed), an LT SDK release loses
  most LT clicks for a day (quarantined the next morning), and an export runs very late. Mid-season someone
  turns off position debiasing because the propensity table looked stale, and reverts it two days later.
days: 20
adopt_day: 7
world: {seed: 61427, search_sessions_per_day: 1950, homepage_sessions_per_day: 780}
schedule:
  ranker: {from_day: 11, every: 1}
  tower: []
delivery: {duplicate_every: 5}
changes:
  - day: 12
    kind: ranker
    overrides:
      params: {min_child_samples: 200, subsample: 0.7}
    note: Leaf-level variance is high on long-tail queries; require more samples per leaf and subsample more.
  - day: 15
    kind: ranker
    overrides:
      position_debias: false
    note: The position propensity table has not been refreshed in a quarter; train without it for now.
  - day: 17
    kind: ranker
    overrides:
      position_debias: true
    note: Revert after review; the stale propensities are still better than none.
incidents:
  - {type: null_feature, feature: price_fit, market: PL, day: 12}
  - {type: click_drop, market: LT, rate: 0.7, day: 14}
  - {type: late_partition, day: 16, hours: 14}
operations:
  - {day: 15, hour: 8, action: quarantine, table: impressions, from_day: 14, to_day: 14, market: LT,
     reason: LT app 4.12 dropped most click events on day 14}
