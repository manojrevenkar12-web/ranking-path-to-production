name: ci

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ptp, POSTGRES_PASSWORD: ptp, POSTGRES_DB: ptp_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ptp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PTP_TEST_DATABASE_URL: postgresql://ptp:ptp@localhost:5432/ptp_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: scripts/ci_run.sh ruff check src tests scripts
      - run: scripts/ci_run.sh ruff format --check src tests scripts
      - run: scripts/ci_run.sh mypy src
      - name: Unit, pipeline and deploy tests
        run: scripts/ci_run.sh pytest -q -m "not season and not kfp"
      - name: The held-out first run is never rewritten
        run: |
          if [ -f heldout/first_run.sha256 ]; then sha256sum -c heldout/first_run.sha256
          else echo "::notice title=held-out::no first run recorded yet"; fi

  kfp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ptp, POSTGRES_PASSWORD: ptp, POSTGRES_DB: ptp_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ptp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PTP_TEST_DATABASE_URL: postgresql://ptp:ptp@localhost:5432/ptp_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: The pipeline definition, run by the KFP local runner
        run: scripts/ci_run.sh pytest -q -m kfp

  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: ../scripts/ci_run.sh npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ptp, POSTGRES_PASSWORD: ptp, POSTGRES_DB: ptp}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ptp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PTP_DATABASE_URL: postgresql://ptp:ptp@localhost:5432/ptp
      PTP_API_TOKENS: e2e-token
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: pip install -e ".[dev]"
      - name: A short season through the whole loop
        run: |
          scripts/ci_run.sh ptpsim run scenarios/dev/smoke.yaml --quiet
          python -c "import json,sys; s=json.load(open('data/seasons/smoke/evaluation.json'))['summary']; print(s); sys.exit(1 if s['harmful_promoted'] else 0)"
      - name: Build the console
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build && npx playwright install --with-deps chromium
      - name: Serve
        run: |
          nohup ptp serve api --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - name: Browser tests, desktop and phone
        working-directory: web
        run: ../scripts/ci_run.sh npx playwright test
      - uses: actions/upload-artifact@v5
        if: failure()
        with: {name: playwright-report, path: web/playwright-report, retention-days: 7}

  vespa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Start Vespa
        run: |
          docker run -d --name vespa -p 8080:8080 -p 19071:19071 vespaengine/vespa
          for i in $(seq 1 90); do curl -sf localhost:19071/state/v1/health && break; sleep 2; done
          docker exec vespa vespa version || true
      - name: The package on a real Vespa
        env: {PTP_VESPA_URL: "http://127.0.0.1:8080", PTP_VESPA_CONFIG_URL: "http://127.0.0.1:19071"}
        run: scripts/ci_run.sh pytest -q -m vespa -s
      - if: failure()
        run: docker logs vespa 2>&1 | tail -n 80 | sed 's/^/::error ::/' | head -n 60

  triton:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Make room for the Triton image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Start Triton (explicit model control)
        run: |
          mkdir -p data/triton && chmod 777 data/triton
          docker run -d --name triton -p 8000:8000 -v "$PWD/data/triton:/models" nvcr.io/nvidia/tritonserver:24.08-py3 \
            tritonserver --model-repository=/models --model-control-mode=explicit --exit-on-error=false
          for i in $(seq 1 120); do curl -sf localhost:8000/v2/health/ready && break; sleep 3; done
      - name: The user tower on a real Triton
        env: {PTP_TRITON_URL: "http://127.0.0.1:8000", PTP_TRITON_REPOSITORY: data/triton}
        run: scripts/ci_run.sh pytest -q -m triton -s
      - if: failure()
        run: docker logs triton 2>&1 | tail -n 60 | sed 's/^/::error ::/'

  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ptp, POSTGRES_PASSWORD: ptp, POSTGRES_DB: ptp_relay}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ptp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - uses: helm/kind-action@v1
        with: {cluster_name: ci}
      - name: Build the image and load it into the cluster
        run: scripts/ci_run.sh docker build -t ranking-path-to-production:ci . && kind load docker-image ranking-path-to-production:ci --name ci
      - name: Point the CI overlay at the runner (docker bridge gateway of the kind network)
        run: |
          GW=$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Gateway}} {{end}}' | tr ' ' '\n' | grep -E '^[0-9]+\.' | head -n1)
          echo "gateway $GW"
          sed -i "s/172.18.0.1/$GW/g" deploy/k8s/overlays/ci/*.yaml
      - name: GitHub and JWKS stand-in on the runner
        run: nohup ptpsim serve github-stand-in --port 9999 > stand-in.log 2>&1 &
      - name: Deploy the relay
        run: |
          kubectl apply -k deploy/k8s/overlays/ci
          kubectl -n buyer-mlops rollout status deploy/relay --timeout=180s
          nohup kubectl -n buyer-mlops port-forward svc/relay 8090:80 > pf.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8090/healthz && break; sleep 1; done
      - name: The relay in the cluster
        env: {PTP_RELAY_URL: "http://127.0.0.1:8090", PTP_STAND_IN_URL: "http://127.0.0.1:9999"}
        run: scripts/ci_run.sh pytest -q -m kind -s
      - name: What the cluster says
        if: failure()
        run: |
          {
            kubectl -n buyer-mlops get pods -o wide
            kubectl -n buyer-mlops describe pods -l app=relay | tail -n 45
            kubectl -n buyer-mlops logs deploy/relay --tail=40
            kubectl -n buyer-mlops logs deploy/relay --previous --tail=40
          } > diag.txt 2>&1 || true
          echo "::error title=relay in kind::$(sed -e 's/%/%25/g' diag.txt | awk 'BEGIN { ORS = "%0A" } { print }')"

  loop:
    # The deploy loop for real: a training run's event goes through Pub/Sub (emulated) to the relay, which sends
    # repository_dispatch to this repository; deploy-model.yml deploys the candidate to two real Vespa containers.
    if: github.event_name == 'push'
    needs: [python]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # repository_dispatch
      actions: read     # watch the deploy run
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ptp, POSTGRES_PASSWORD: ptp, POSTGRES_DB: ptp}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ptp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PTP_DATABASE_URL: postgresql://ptp:ptp@localhost:5432/ptp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: A short season, then one more training run
        run: |
          scripts/ci_run.sh ptpsim run scenarios/dev/smoke.yaml --quiet
          export PTP_LAKE=data/seasons/smoke/lake PTP_ARTIFACTS=data/seasons/smoke/artifacts
          AS_OF=$(python -c "import json; print(json.load(open('data/seasons/smoke/registry.json'))['t0'] + 14*86400 + 3*3600)")
          export PTP_NOW=$AS_OF
          ptp pipeline run --kind ranker --as-of "$AS_OF" --run-id loop-ranker --no-publish | tee run.json
          python -c "import json,sys; r=json.load(open('run.json')); print('::notice title=candidate::'+json.dumps({k:r.get(k) for k in ('outcome','version','blocked')})); sys.exit(0 if r['outcome']=='candidate' else 1)"
          ptp ci bundle --dir bundle --docs data/seasons/smoke/vespa_docs.jsonl
      - uses: actions/upload-artifact@v5
        with: {name: ci-bundle, path: bundle, retention-days: 3}
      - name: Event -> Pub/Sub -> relay -> repository_dispatch
        env:
          PTP_GITHUB_API: https://api.github.com
          PTP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PTP_GITHUB_REPOSITORY: ${{ github.repository }}
          PTP_RELAY_JWKS_URL: http://127.0.0.1:8085/oauth2/v3/certs
          PTP_DISPATCH_EXTRA: '{"env": "ci", "bundle_run": "${{ github.run_id }}"}'
        run: |
          nohup ptpsim serve pubsub --port 8085 --push-url http://127.0.0.1:8090/pubsub/push > pubsub.log 2>&1 &
          nohup ptp serve relay > relay.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8090/healthz && curl -sf localhost:8085/oauth2/v3/certs > /dev/null && break; sleep 1; done
          date -u +%Y-%m-%dT%H:%M:%SZ > dispatched_after
          PTP_PUBSUB_API=http://127.0.0.1:8085 ptp pipeline publish --run-id loop-ranker --kind ranker
          for i in $(seq 1 30); do [ "$(psql "$PTP_DATABASE_URL" -tAc "select count(*) from relay_messages where action='dispatched'")" -ge 1 ] && break; sleep 2; done
          psql "$PTP_DATABASE_URL" -tc "select message_id, action from relay_messages" | sed 's/^/::notice title=relay::/'
      - name: Wait for the deploy workflow it started
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          SINCE=$(cat dispatched_after)
          for i in $(seq 1 100); do
            RUN=$(gh run list --workflow deploy-model.yml --event repository_dispatch --json databaseId,createdAt,status,conclusion \
                  --jq "[.[] | select(.createdAt >= \"$SINCE\")][0]")
            if [ -n "$RUN" ] && [ "$RUN" != "null" ]; then
              echo "$RUN"
              if [ "$(echo "$RUN" | jq -r .status)" = "completed" ]; then
                echo "::notice title=deploy-model::$RUN"
                [ "$(echo "$RUN" | jq -r .conclusion)" = "success" ] && exit 0 || exit 1
              fi
            fi
            sleep 15
          done
          echo "::error ::no deploy-model run completed"; exit 1
